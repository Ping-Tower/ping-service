stages:
  - test
  - build
  - container_scan
  - deploy
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

tests:
  stage: test
  image: golang:1.26.1-alpine
  script:
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./...
build_image:
  stage: build
  image: docker:27.5.0
  services:
    - docker:27.5.0-dind
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: 1
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - docker buildx create --use --driver docker-container --driver-opt network=host
    - docker buildx build --pull --provenance=false --sbom=false --cache-from
      type=registry,ref=$CI_REGISTRY_IMAGE:buildcache --cache-to
      type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max -t $DOCKER_IMAGE_NAME --push .

deploy:
  stage: deploy
  needs:
    - build_image
    - trivy-image
  image:
    name: alpine/kubectl:1.37.1
    entrypoint: [""]
  tags: [saas-linux-small-amd64]
  resource_group: pingtower-production
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  allow_failure: false
  manual_confirmation: "Развернуть ping-service в production?"
  timeout: 20m
  script:
    - kubectl config use-context pingtower/infra:pingtower
    - sed -i "s/REPLACE_WITH_COMMIT_SHA/$CI_COMMIT_SHA/g" k8s/kustomization.yaml
    - kubectl apply --dry-run=server -k k8s/
    # Собственные Store у воркера нет; нужные секреты выдаёт pingtower-infra.
    - kubectl -n pingtower wait --for=condition=Ready externalsecret/rabbitmq externalsecret/redis
      externalsecret/gitlab-registry --timeout=120s
    - kubectl -n pingtower get secret rabbitmq redis gitlab-registry -o name
    - kubectl apply -k k8s/
    - kubectl -n pingtower rollout status deployment/ping-service --timeout=600s
default:
  tags:
    - saas-linux-small-amd64
include:
  - local: .gitlab/ci/security.yml
